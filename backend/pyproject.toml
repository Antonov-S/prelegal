[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API and static frontend server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    # TestClient comes from Starlette, which since 1.x imports httpx2 first and
    # emits StarletteDeprecationWarning when it falls back to httpx.
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
